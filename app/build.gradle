plugins {
    // Apply the scala Plugin to add support for Scala.
    id 'scala'

    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use Scala 2.13 in our library project
    implementation libs.scala.library

    // This dependency is used by the application.
    implementation libs.guava

    // GraphQL schema & execution
    implementation libs.sangria
    implementation libs.sangria.circe

    // JSON support for the GraphQL HTTP endpoint
    implementation libs.circe.core
    implementation libs.circe.generic
    implementation libs.circe.parser

    // HTTP server exposing the /graphql endpoint
    implementation libs.pekko.actor
    implementation libs.pekko.stream
    implementation libs.pekko.http
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit4 test framework
            useJUnit('4.13.2')

            dependencies {
                // Use Scalatest for testing our library
                implementation libs.scalatest.v2.v13
                implementation libs.junit.v4.v13.v2.v13

                // Test the GraphQL routes without binding a real HTTP server
                implementation libs.pekko.http.testkit
                implementation libs.pekko.testkit

                // Need scala-xml at test runtime
                runtimeOnly libs.scala.xml.v2.v13
            }
        }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Always execute tests, never restore results from the build cache.
tasks.withType(Test).configureEach {
    outputs.cacheIf { false }
}

application {
    // Define the main class for the application.
    mainClass = 'com.example.GraphQLServer'
}

def scalaSourceDirs = sourceSets.collect { it.scala.srcDirs }.flatten()

tasks.register('scalafmtCheck', Exec) {
    group = 'formatting'
    description = 'Check that all Scala sources are formatted with scalafmt.'
    workingDir = rootProject.projectDir
    commandLine = ['scalafmt', '--test'] + scalaSourceDirs.collect { it.absolutePath }
}

tasks.register('scalafmtApply', Exec) {
    group = 'formatting'
    description = 'Format all Scala sources with scalafmt.'
    workingDir = rootProject.projectDir
    commandLine = ['scalafmt'] + scalaSourceDirs.collect { it.absolutePath }
}
